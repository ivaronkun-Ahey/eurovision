<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1A0B2E">
<title>🎤 Колесо Евровидения 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF1B6B;
    --pink-soft:#ff5a93;
    --cyan:#2CD8FF;
    --gold:#FFD700;
    --purple:#A855F7;
    --magenta:#C026D3;
    --bg:#08071A;
    --card:#1A0B2E;
    --text:#FFF5F8;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Onest',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(168,85,247,.35) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,27,107,.25) 0%, transparent 55%),
      linear-gradient(180deg,#1A0B2E 0%,#0a0518 60%,#000 100%);
    background-attachment: fixed;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    overscroll-behavior:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    position:relative;
    padding:env(safe-area-inset-top,16px) 14px env(safe-area-inset-bottom,24px);
  }

  /* Background sparkles */
  .sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}
  .spark{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#fff;box-shadow:0 0 6px #fff;
    animation:twinkle linear infinite;opacity:.4;
  }
  @keyframes twinkle{
    0%,100%{opacity:0;transform:scale(.4)}
    50%{opacity:1;transform:scale(1.6)}
  }

  /* Rotating spotlight rays */
  .rays{
    position:fixed;top:50%;left:50%;
    width:140vmax;height:140vmax;
    transform:translate(-50%,-50%);
    background:conic-gradient(
      from 0deg,
      transparent 0deg, rgba(255,27,107,.07) 25deg, transparent 50deg,
      rgba(44,216,255,.07) 75deg, transparent 100deg,
      rgba(255,215,0,.07) 125deg, transparent 150deg,
      rgba(168,85,247,.07) 175deg, transparent 200deg,
      rgba(192,38,211,.07) 225deg, transparent 250deg,
      rgba(255,27,107,.07) 275deg, transparent 300deg,
      rgba(44,216,255,.07) 325deg, transparent 360deg
    );
    animation:raysrot 28s linear infinite;
    pointer-events:none;z-index:0;filter:blur(30px);
  }
  @keyframes raysrot{to{transform:translate(-50%,-50%) rotate(360deg)}}

  /* App layout */
  .app{
    position:relative;z-index:1;
    max-width:480px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }

  /* Header */
  .hdr{text-align:center;margin-top:4px}
  .heart{
    font-family:'Unbounded',sans-serif;font-weight:900;font-size:38px;
    color:var(--pink);
    text-shadow:0 0 16px rgba(255,27,107,.9), 0 0 32px rgba(255,27,107,.5);
    display:block;line-height:.9;
    animation:beat 1.4s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}45%{transform:scale(1)}60%{transform:scale(1.07)}}
  .ver{
    display:block;font-family:'Unbounded',sans-serif;font-weight:700;
    font-size:22px;letter-spacing:.04em;
    background:linear-gradient(135deg,var(--gold) 0%,var(--pink) 50%,var(--cyan) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-top:6px;
  }
  .badge-row{
    display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap;
  }
  .badge{
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 10px;border-radius:100px;
    border:1px solid rgba(255,215,0,.4);
    background:rgba(255,215,0,.08);color:var(--gold);
    font-weight:600;
  }
  .badge.venue{
    border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);
  }

  /* Wheel */
  .wheel-wrap{
    position:relative;width:100%;max-width:380px;aspect-ratio:1;
    margin-top:4px;
  }
  .halo{
    position:absolute;inset:-30px;
    background:radial-gradient(circle,rgba(255,215,0,.18) 0%,rgba(255,27,107,.1) 35%,transparent 70%);
    filter:blur(18px);pointer-events:none;
    animation:haloSpin 6s ease-in-out infinite;
  }
  @keyframes haloSpin{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
  #wheel{
    width:100%;height:100%;
    filter:drop-shadow(0 8px 24px rgba(255,27,107,.35)) drop-shadow(0 0 40px rgba(168,85,247,.3));
    position:relative;z-index:1;
  }
  #sectors{transform-origin:200px 200px;will-change:transform}
  .sector path{transition:filter .2s}

  /* Hub - disco ball */
  .hub-glow{filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}

  /* Pointer (top, heart) */
  .pointer{
    position:absolute;top:-6px;left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    z-index:3;pointer-events:none;
  }
  .pointer::after{
    content:'';position:absolute;top:0;left:-14px;
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:22px solid var(--gold);
    filter:drop-shadow(0 0 8px rgba(255,215,0,.9)) drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .pointer::before{
    content:'❤';
    position:absolute;top:-30px;left:-12px;
    font-size:24px;color:var(--pink);
    text-shadow:0 0 12px rgba(255,27,107,1);
    animation:beat 1.4s ease-in-out infinite;
  }

  /* Spin button */
  .spin-btn{
    font-family:'Unbounded',sans-serif;font-weight:700;
    font-size:17px;letter-spacing:.06em;
    padding:16px 38px;border:0;border-radius:100px;
    background:linear-gradient(135deg,var(--pink) 0%,var(--magenta) 60%,var(--purple) 100%);
    color:#fff;cursor:pointer;
    box-shadow:
      0 4px 20px rgba(255,27,107,.55),
      0 0 60px rgba(192,38,211,.3),
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 0 rgba(0,0,0,.2);
    display:flex;align-items:center;gap:10px;
    transition:transform .15s, box-shadow .15s;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    position:relative;overflow:hidden;
  }
  .spin-btn::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);
    transform:translateX(-100%);
    animation:shine 3s ease-in-out infinite;
  }
  @keyframes shine{50%,100%{transform:translateX(100%)}}
  .spin-btn:active{transform:scale(.96)}
  .spin-btn:disabled{opacity:.5;pointer-events:none;filter:saturate(.5)}
  .spin-emoji{font-size:22px;animation:wiggle 2s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}

  /* Controls */
  .controls{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    font-size:13px;
  }
  .ctrl{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);color:#fff;
    font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s,background .2s;
  }
  .ctrl:active{transform:scale(.9)}
  .ctrl:hover{background:rgba(255,255,255,.1)}
  .toggle{
    display:flex;align-items:center;gap:8px;
    color:rgba(255,255,255,.75);font-size:13px;
    padding:8px 14px;border-radius:100px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    cursor:pointer;
  }
  .toggle input{accent-color:var(--pink);width:16px;height:16px}

  /* Recent winners strip */
  .recent{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:rgba(255,255,255,.55);
    min-height:30px;flex-wrap:wrap;justify-content:center;
    margin-top:4px;
  }
  .recent-flag{font-size:22px;cursor:default;animation:popIn .3s ease-out}
  @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

  /* Footer credit */
  .foot{
    font-size:10px;color:rgba(255,255,255,.3);text-align:center;
    margin-top:6px;letter-spacing:.05em;
  }

  /* Winner overlay */
  .winner{
    position:fixed;inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    z-index:10;opacity:0;
    transition:opacity .3s;padding:20px;
  }
  .winner.show{opacity:1}
  .winner-card{
    position:relative;
    background:linear-gradient(160deg,#2a0a3e 0%,#1A0B2E 100%);
    border:1px solid rgba(255,215,0,.4);
    border-radius:28px;padding:32px 24px 24px;
    text-align:center;max-width:340px;width:100%;
    box-shadow:
      0 0 80px rgba(255,27,107,.45),
      0 0 120px rgba(168,85,247,.3),
      inset 0 1px 0 rgba(255,255,255,.1);
    z-index:2;
    transform:scale(.85);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .winner.show .winner-card{transform:scale(1)}

  .douze{
    font-family:'Unbounded',sans-serif;font-weight:900;
    font-size:22px;letter-spacing:.12em;
    background:linear-gradient(135deg,var(--gold),#ff9a44,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:4px;
    animation:douzePulse 1s ease-in-out infinite;
  }
  @keyframes douzePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .douze-sub{
    font-size:11px;color:rgba(255,215,0,.7);
    letter-spacing:.2em;text-transform:uppercase;
    margin-bottom:14px;
  }

  .winner-flag{
    font-size:84px;line-height:1;
    filter:drop-shadow(0 6px 20px rgba(255,255,255,.25));
    animation:flagBounce .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes flagBounce{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
  .winner-name{
    font-family:'Unbounded',sans-serif;font-weight:700;
    font-size:30px;margin:10px 0 4px;
    background:linear-gradient(135deg,#fff,#ffe0ec);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .winner-tag{
    font-size:13px;color:rgba(255,255,255,.65);
    margin-bottom:20px;min-height:18px;line-height:1.4;
    padding:0 10px;
  }
  .winner-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .winner-share,.winner-close{
    padding:11px 22px;border-radius:100px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);color:#fff;
    font:inherit;cursor:pointer;font-size:14px;font-weight:500;
    transition:transform .15s,background .2s;
  }
  .winner-share:active,.winner-close:active{transform:scale(.95)}
  .winner-close{
    background:linear-gradient(135deg,var(--pink),var(--magenta));
    border:0;font-weight:700;
    box-shadow:0 4px 16px rgba(255,27,107,.4);
  }

  /* Confetti */
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .conf{
    position:absolute;top:-30px;
    width:8px;height:14px;border-radius:1px;
    animation:fall linear forwards;
    will-change:transform;
  }
  .conf.flag{
    width:auto;height:auto;font-size:20px;background:transparent !important;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(720deg)}
  }

  /* Empty state */
  .empty-msg{
    text-align:center;color:rgba(255,255,255,.5);
    font-size:14px;padding:20px;
  }

  /* Responsive */
  @media (max-height:680px){
    .heart{font-size:30px}
    .ver{font-size:18px}
    .wheel-wrap{max-width:300px}
    .spin-btn{padding:13px 32px;font-size:15px}
    .badge{display:none}
    .badge.venue{display:inline-block}
  }
  @media (min-width:540px){
    .wheel-wrap{max-width:420px}
  }
</style>
</head>
<body>

<div class="sparkles" id="sparkles"></div>
<div class="rays" aria-hidden="true"></div>

<main class="app">
  <header class="hdr">
    <span class="heart">♥</span>
    <span class="ver">EUROVISION 2026</span>
    <div class="badge-row">
      <span class="badge">70-й сезон</span>
      <span class="badge venue">Вена • 16 мая</span>
    </div>
  </header>

  <div class="wheel-wrap">
    <div class="halo"></div>
    <svg id="wheel" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="discoGrad" cx="35%" cy="35%">
          <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
          <stop offset="40%" stop-color="#c0c0e0" stop-opacity=".7"/>
          <stop offset="100%" stop-color="#3a2050"/>
        </radialGradient>
        <pattern id="discoPat" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(20)">
          <rect width="6" height="6" fill="url(#discoGrad)"/>
          <line x1="0" y1="0" x2="6" y2="0" stroke="rgba(0,0,0,.25)" stroke-width=".3"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(0,0,0,.25)" stroke-width=".3"/>
        </pattern>
        <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="sectors"></g>
      <!-- Disco ball hub -->
      <circle cx="200" cy="200" r="40" fill="url(#discoPat)" stroke="rgba(255,255,255,.3)" stroke-width="1.2" class="hub-glow"/>
      <circle cx="190" cy="190" r="8" fill="rgba(255,255,255,.7)" filter="blur(2px)"/>
      <text x="200" y="208" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="28" fill="#fff" style="filter:drop-shadow(0 0 4px rgba(255,27,107,.9))">♥</text>
    </svg>
    <div class="pointer"></div>
  </div>

  <button id="spin" class="spin-btn">
    <span class="spin-emoji">🎤</span>
    <span>КРУТИТЬ!</span>
  </button>

  <div class="controls">
    <button class="ctrl" id="mute" title="Звук">🔊</button>
    <label class="toggle">
      <input type="checkbox" id="removeOnPick">
      <span>Убирать выбранную</span>
    </label>
    <button class="ctrl" id="reset" title="Сброс">🔄</button>
  </div>

  <div class="recent" id="recent"></div>

  <div class="foot">35 стран • Вена • Wiener Stadthalle • 16.05.2026</div>
</main>

<div class="winner" id="winner" hidden>
  <div class="confetti" id="confetti"></div>
  <div class="winner-card">
    <div class="douze">DOUZE POINTS!</div>
    <div class="douze-sub" id="douzeSub">12 баллов едут в...</div>
    <div class="winner-flag" id="winnerFlag">🇦🇹</div>
    <div class="winner-name" id="winnerName">Австрия</div>
    <div class="winner-tag" id="winnerTag"></div>
    <div class="winner-actions">
      <button class="winner-share" id="share">📋 Поделиться</button>
      <button class="winner-close" id="close">Дальше →</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== Country data =====
  const COUNTRIES = [
    {flag:'🇦🇱', code:'AL', name:'Албания'},
    {flag:'🇦🇲', code:'AM', name:'Армения'},
    {flag:'🇦🇺', code:'AU', name:'Австралия'},
    {flag:'🇦🇹', code:'AT', name:'Австрия', tag:'host', note:'🏠 Хозяева сезона. Победили в 2025 — JJ «Wasted Love»'},
    {flag:'🇦🇿', code:'AZ', name:'Азербайджан'},
    {flag:'🇧🇪', code:'BE', name:'Бельгия'},
    {flag:'🇧🇬', code:'BG', name:'Болгария', tag:'returning', note:'🔁 Возвращение после 3 лет отсутствия'},
    {flag:'🇭🇷', code:'HR', name:'Хорватия'},
    {flag:'🇨🇾', code:'CY', name:'Кипр'},
    {flag:'🇨🇿', code:'CZ', name:'Чехия'},
    {flag:'🇩🇰', code:'DK', name:'Дания'},
    {flag:'🇪🇪', code:'EE', name:'Эстония'},
    {flag:'🇫🇮', code:'FI', name:'Финляндия'},
    {flag:'🇫🇷', code:'FR', name:'Франция', tag:'big4', note:'⭐ Big-4 — сразу в финале'},
    {flag:'🇬🇪', code:'GE', name:'Грузия'},
    {flag:'🇩🇪', code:'DE', name:'Германия', tag:'big4', note:'⭐ Big-4 — сразу в финале'},
    {flag:'🇬🇷', code:'GR', name:'Греция'},
    {flag:'🇮🇱', code:'IL', name:'Израиль'},
    {flag:'🇮🇹', code:'IT', name:'Италия', tag:'big4', note:'⭐ Big-4 — сразу в финале'},
    {flag:'🇱🇻', code:'LV', name:'Латвия'},
    {flag:'🇱🇹', code:'LT', name:'Литва'},
    {flag:'🇱🇺', code:'LU', name:'Люксембург'},
    {flag:'🇲🇹', code:'MT', name:'Мальта'},
    {flag:'🇲🇩', code:'MD', name:'Молдова', tag:'returning', note:'🔁 Возвращение после года отсутствия'},
    {flag:'🇲🇪', code:'ME', name:'Черногория'},
    {flag:'🇳🇴', code:'NO', name:'Норвегия'},
    {flag:'🇵🇱', code:'PL', name:'Польша'},
    {flag:'🇵🇹', code:'PT', name:'Португалия'},
    {flag:'🇷🇴', code:'RO', name:'Румыния', tag:'returning', note:'🔁 Возвращение после 2 лет отсутствия'},
    {flag:'🇸🇲', code:'SM', name:'Сан-Марино'},
    {flag:'🇷🇸', code:'RS', name:'Сербия'},
    {flag:'🇸🇪', code:'SE', name:'Швеция'},
    {flag:'🇨🇭', code:'CH', name:'Швейцария'},
    {flag:'🇺🇦', code:'UA', name:'Украина'},
    {flag:'🇬🇧', code:'GB', name:'Великобритания', tag:'big4', note:'⭐ Big-4 — сразу в финале'},
  ];

  const COLORS = ['#FF1B6B','#2CD8FF','#FFD700','#A855F7','#C026D3'];
  const DOUZE_PHRASES = [
    '12 баллов едут в...',
    'И победителем становится...',
    'А вот и наш фаворит!',
    'Жюри сделало выбор...',
    'Колесо решило!',
  ];

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 200, CY = 200, R_OUT = 188, R_IN = 50;

  // State
  let pool = [...COUNTRIES];
  let angle = 0;
  let spinning = false;
  let muted = false;
  const recent = [];

  // Telegram WebApp init
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand?.();
      tg.disableVerticalSwipes?.();
      tg.setHeaderColor?.('#1A0B2E');
      tg.setBackgroundColor?.('#08071A');
    } catch(e) {}
  }

  // ===== Wheel rendering =====
  const sectorsG = document.getElementById('sectors');

  function renderWheel() {
    sectorsG.innerHTML = '';
    const n = pool.length;
    if (n === 0) {
      const t = document.createElementNS(SVG_NS,'text');
      t.setAttribute('x',CX);t.setAttribute('y',CY-80);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('fill','rgba(255,255,255,.5)');
      t.setAttribute('font-size','14');
      t.textContent = 'Все выбраны 🎉';
      sectorsG.appendChild(t);
      return;
    }
    const stepRad = (Math.PI*2)/n;
    pool.forEach((c,i) => {
      const start = -Math.PI/2 + i*stepRad;
      const end = start + stepRad;
      const mid = start + stepRad/2;

      const x1 = CX + R_OUT*Math.cos(start);
      const y1 = CY + R_OUT*Math.sin(start);
      const x2 = CX + R_OUT*Math.cos(end);
      const y2 = CY + R_OUT*Math.sin(end);
      const xi1 = CX + R_IN*Math.cos(start);
      const yi1 = CY + R_IN*Math.sin(start);
      const xi2 = CX + R_IN*Math.cos(end);
      const yi2 = CY + R_IN*Math.sin(end);

      const largeArc = stepRad > Math.PI ? 1 : 0;
      const path = `M ${xi1} ${yi1} L ${x1} ${y1} A ${R_OUT} ${R_OUT} 0 ${largeArc} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${R_IN} ${R_IN} 0 ${largeArc} 0 ${xi1} ${yi1} Z`;

      const g = document.createElementNS(SVG_NS,'g');
      g.setAttribute('class','sector');
      g.setAttribute('data-i', i);

      const p = document.createElementNS(SVG_NS,'path');
      p.setAttribute('d', path);
      const baseColor = COLORS[i % COLORS.length];
      p.setAttribute('fill', baseColor);
      p.setAttribute('stroke','rgba(255,255,255,.18)');
      p.setAttribute('stroke-width','0.6');
      g.appendChild(p);

      // Subtle radial gradient overlay (darker toward outer for depth) — done via stroke
      const innerLine = document.createElementNS(SVG_NS,'path');
      innerLine.setAttribute('d', `M ${xi1} ${yi1} L ${x1} ${y1}`);
      innerLine.setAttribute('stroke','rgba(0,0,0,.15)');
      innerLine.setAttribute('stroke-width','0.5');
      g.appendChild(innerLine);

      // Flag emoji
      const fr = 132;
      const fx = CX + fr*Math.cos(mid);
      const fy = CY + fr*Math.sin(mid);
      const flag = document.createElementNS(SVG_NS,'text');
      flag.setAttribute('x', fx);
      flag.setAttribute('y', fy);
      flag.setAttribute('text-anchor','middle');
      flag.setAttribute('dominant-baseline','central');
      flag.setAttribute('font-size','15');
      flag.style.pointerEvents = 'none';
      flag.textContent = c.flag;
      g.appendChild(flag);

      // Tag indicator (star/house) for prequalified
      if (c.tag === 'big4' || c.tag === 'host') {
        const sr = 165;
        const sx = CX + sr*Math.cos(mid);
        const sy = CY + sr*Math.sin(mid);
        const st = document.createElementNS(SVG_NS,'text');
        st.setAttribute('x', sx);
        st.setAttribute('y', sy);
        st.setAttribute('text-anchor','middle');
        st.setAttribute('dominant-baseline','central');
        st.setAttribute('font-size','9');
        st.textContent = c.tag === 'host' ? '🏠' : '⭐';
        g.appendChild(st);
      }

      sectorsG.appendChild(g);
    });
    sectorsG.setAttribute('transform', `rotate(${angle} ${CX} ${CY})`);
  }

  function sectorAtPointer() {
    const n = pool.length;
    if (n === 0) return -1;
    const stepDeg = 360 / n;
    const norm = ((-angle % 360) + 360) % 360;
    return Math.floor(norm / stepDeg) % n;
  }

  // ===== Spin =====
  function spin() {
    if (spinning || pool.length === 0) return;
    spinning = true;

    // Resume audio (autoplay policy)
    audio.resume();

    const n = pool.length;
    const targetIdx = Math.floor(Math.random() * n);
    const stepDeg = 360 / n;

    // Target angle so that sector targetIdx is at top pointer
    const targetMod = (-(targetIdx + 0.5) * stepDeg);
    const targetNorm = ((targetMod % 360) + 360) % 360;
    const currentNorm = ((angle % 360) + 360) % 360;
    let delta = targetNorm - currentNorm;
    if (delta < 0) delta += 360;
    delta += 360 * (5 + Math.floor(Math.random()*3)); // 5-7 turns

    const startA = angle;
    const finalA = startA + delta;
    const duration = 4500 + Math.random()*1200;
    const startT = performance.now();

    let lastTickIdx = sectorAtPointer();

    function frame(now) {
      const t = Math.min(1, (now - startT) / duration);
      const eased = 1 - Math.pow(1 - t, 4); // easeOutQuart
      angle = startA + delta * eased;
      sectorsG.setAttribute('transform', `rotate(${angle} ${CX} ${CY})`);

      const cur = sectorAtPointer();
      if (cur !== lastTickIdx) {
        lastTickIdx = cur;
        audio.tick();
        haptic('tick');
      }

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        angle = finalA;
        finishSpin(targetIdx);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(idx) {
    spinning = false;
    const winner = pool[idx];
    recent.unshift(winner);
    if (recent.length > 6) recent.pop();
    renderRecent();

    audio.win();
    haptic('win');
    showWinner(winner);
    spawnConfetti(winner);

    if (document.getElementById('removeOnPick').checked) {
      // Wait till winner overlay closes — actually let's remove right after a small delay
      setTimeout(() => {
        const i = pool.indexOf(winner);
        if (i >= 0) {
          pool.splice(i, 1);
          // After removing, normalize angle (otherwise pointer math is off, but renderWheel re-applies)
          renderWheel();
        }
      }, 600);
    }
  }

  // ===== Audio =====
  const audio = (() => {
    let ctx = null;
    function getCtx() {
      if (!ctx) {
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      }
      return ctx;
    }
    return {
      resume() {
        const c = getCtx();
        if (c && c.state === 'suspended') c.resume();
      },
      tick() {
        if (muted) return;
        const c = getCtx(); if (!c) return;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = 'square';
        o.frequency.value = 1400;
        g.gain.setValueAtTime(.05, c.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .04);
        o.connect(g).connect(c.destination);
        o.start();
        o.stop(c.currentTime + .04);
      },
      win() {
        if (muted) return;
        const c = getCtx(); if (!c) return;
        // Triumphant arpeggio — major chord climbing
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => {
            const o = c.createOscillator();
            const g = c.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(.0001, c.currentTime);
            g.gain.exponentialRampToValueAtTime(.18, c.currentTime + .02);
            g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .55);
            o.connect(g).connect(c.destination);
            o.start();
            o.stop(c.currentTime + .6);
          }, i * 110);
        });
        // Final brass blast (sawtooth low)
        setTimeout(() => {
          const o = c.createOscillator();
          const g = c.createGain();
          o.type = 'sawtooth';
          o.frequency.value = 261.63;
          const filter = c.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1500;
          g.gain.setValueAtTime(.0001, c.currentTime);
          g.gain.exponentialRampToValueAtTime(.12, c.currentTime + .03);
          g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + 1.2);
          o.connect(filter).connect(g).connect(c.destination);
          o.start();
          o.stop(c.currentTime + 1.3);
        }, 600);
      }
    };
  })();

  function haptic(kind) {
    const h = window.Telegram?.WebApp?.HapticFeedback;
    if (!h) return;
    try {
      if (kind === 'tick') h.impactOccurred?.('light');
      if (kind === 'win') h.notificationOccurred?.('success');
    } catch(e) {}
  }

  // ===== Confetti =====
  function spawnConfetti(winner) {
    const root = document.getElementById('confetti');
    root.innerHTML = '';
    const colors = ['#FF1B6B','#2CD8FF','#FFD700','#A855F7','#C026D3','#FFFFFF'];
    const total = 90;
    for (let i = 0; i < total; i++) {
      const c = document.createElement('div');
      const isFlag = Math.random() < 0.18;
      c.className = 'conf' + (isFlag ? ' flag' : '');
      c.style.left = Math.random() * 100 + '%';
      if (isFlag) {
        c.textContent = winner.flag;
      } else {
        c.style.background = colors[i % colors.length];
      }
      const dur = 2 + Math.random() * 2.5;
      const delay = Math.random() * 1.2;
      c.style.animationDuration = dur + 's';
      c.style.animationDelay = delay + 's';
      c.style.transform = `translateY(0) rotate(${Math.random()*360}deg)`;
      root.appendChild(c);
    }
    setTimeout(() => { root.innerHTML = ''; }, 5000);
  }

  // ===== Sparkles =====
  (function initSparkles() {
    const root = document.getElementById('sparkles');
    const n = window.innerWidth < 500 ? 35 : 60;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 4 + 's';
      s.style.animationDuration = 2 + Math.random() * 4 + 's';
      const size = 1 + Math.random() * 2;
      s.style.width = s.style.height = size + 'px';
      root.appendChild(s);
    }
  })();

  // ===== Recent =====
  function renderRecent() {
    const r = document.getElementById('recent');
    if (recent.length === 0) { r.innerHTML = ''; return; }
    r.innerHTML = '<span style="opacity:.6">Недавние:</span>' +
      recent.map(c => `<span class="recent-flag" title="${c.name}">${c.flag}</span>`).join('');
  }

  // ===== Winner overlay =====
  function showWinner(c) {
    const w = document.getElementById('winner');
    document.getElementById('winnerFlag').textContent = c.flag;
    document.getElementById('winnerName').textContent = c.name;
    document.getElementById('winnerTag').textContent = c.note || '';
    document.getElementById('douzeSub').textContent = DOUZE_PHRASES[Math.floor(Math.random()*DOUZE_PHRASES.length)];
    w.hidden = false;
    requestAnimationFrame(() => w.classList.add('show'));
  }

  function closeWinner() {
    const w = document.getElementById('winner');
    w.classList.remove('show');
    setTimeout(() => { w.hidden = true; }, 320);
  }

  // ===== Share =====
  function shareWinner() {
    const c = recent[0]; if (!c) return;
    const text = `🎤 Колесо Евровидения 2026 выбрало:\n${c.flag} ${c.name}!`;

    // 1) If running as Telegram Mini App, send to bot
    if (tg && tg.sendData) {
      try { tg.sendData(JSON.stringify({type:'eurovision_pick', code:c.code, name:c.name})); } catch(e) {}
    }

    // 2) Native share / clipboard
    if (navigator.share) {
      navigator.share({text}).catch(()=>copyToClipboard(text));
    } else {
      copyToClipboard(text);
    }
  }
  function copyToClipboard(text) {
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      ta.remove();
    }
    const btn = document.getElementById('share');
    const old = btn.textContent;
    btn.textContent = '✓ Скопировано';
    setTimeout(() => btn.textContent = old, 1500);
  }

  // ===== Wire up =====
  document.getElementById('spin').addEventListener('click', spin);
  document.getElementById('close').addEventListener('click', closeWinner);
  document.getElementById('share').addEventListener('click', shareWinner);

  document.getElementById('mute').addEventListener('click', e => {
    muted = !muted;
    e.currentTarget.textContent = muted ? '🔇' : '🔊';
  });

  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Сбросить колесо? Все страны вернутся.')) return;
    pool = [...COUNTRIES];
    recent.length = 0;
    angle = 0;
    renderWheel();
    renderRecent();
    closeWinner();
  });

  // Tap on the disco hub also spins
  document.querySelector('#wheel .hub-glow')?.addEventListener('click', spin);

  // Initial render
  renderWheel();
})();
</script>
